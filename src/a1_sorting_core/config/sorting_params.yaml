# A1 分拣参数(ROS1 Noetic + Panda 移植版)
# 组长 ROS2 版: a1_sorting_core/config/sorting_params.yaml(/节点名: ros__parameters:)
# ROS1 版: 直接按节点名分组,launch 里 <rosparam command="load"> 加载后就是 /节点名/参数。
# 坐标系 panda_link0(组长是 world,UR5e 装在立柱上)。Panda 底座在原点,桌面 z=0。

# 共享几何:spawn_parts / executor / recorder / vision 都读这里(唯一真源)
a1:
  frame: panda_link0
  part_size: 0.05                  # 与组长 PART_SIZE 相同(5cm 立方体)
  part_prefix: part_
  # 来料槽:与组长 run_trials.py 的 FEED_SLOTS 相同 (0.45, -0.15/0/0.15)
  feed_slots_x: [0.45, 0.45, 0.45]
  feed_slots_y: [-0.15, 0.0, 0.15]
  feed_z: 0.025                    # 工件中心高度(桌面 0 + 半边 0.025)
  # 料区:沿用组长 legacy 两箱名字 bin_A / bin_B 和颜色分配(暖色 -> A,冷色 -> B),
  # 位置改到 Panda 左右两侧(组长 bin_A(0.35,0.20)/bin_B(0.50,0.20) 会和来料槽打架)
  bin_names: [bin_A, bin_B]
  bins:
    bin_A: {x: 0.35, y: 0.35, half_x: 0.10, half_y: 0.10}
    bin_B: {x: 0.35, y: -0.35, half_x: 0.10, half_y: 0.10}

task_dispatcher:
  auto_start: true                 # 与组长 yaml 相同:来料即入队开始;false 时需调用 /sort_task start_batch
  dispatch_delay: 1.0

pick_place_executor:
  arm_name: arm1
  group_name: panda_arm            # 组长: ur_manipulator
  hand_group: panda_hand          # 本机 panda_moveit_config 0.8.1 的组名是 panda_hand,不是 hand
  pose_link: panda_link8           # 组长: tool0
  attach_link: panda_hand
  standby_named: ready             # 组长: standby 位姿;Panda 用 SRDF 里的 'ready'
  tcp_z_offset: 0.105              # panda_link8 到夹持中心的竖直距离(组长 UR5e 是 0.211)
  pre_grasp_height: 0.10           # 组长 0.08
  place_height: 0.002              # 放置时工件底面离料区 2mm,避免"贴合即碰撞"
  gripper_open: 0.08               # 两指总开度
  gripper_close: 0.05              # 闭合到工件宽度
  velocity_scaling: 0.5
  planning_time: 5.0
  attempts: 2                      # 与组长相同:总尝试次数(含首试)
  inject_failure_parts: ['']       # 例 ['part_2']:该件首次尝试注入失败,演示失败恢复
  # 类别 -> 料区(组长 legacy 默认:暖色 red/yellow -> bin_A,冷色 green/blue -> bin_B)
  bin_for_red: bin_A
  bin_for_green: bin_B
  bin_for_yellow: bin_A
  bin_for_blue: bin_B
  # 料区内格位偏移(与组长默认值相同),第 n 件放第 n%4 格
  bin_grid_offsets_x: [-0.05, 0.05, -0.05, 0.05]
  bin_grid_offsets_y: [-0.035, -0.035, 0.035, 0.035]

result_recorder:
  csv_path: ~/.ros/a1_sorting_results.csv     # 与组长相同
  expected_parts: [part_1, part_2, part_3]
  table_top_z: 0.0
  markers_frame: panda_link0

spawn_parts:
  part_colors: red,green,red        # 与组长 launch 默认 part_colors 相同
  publish_arrival: true             # true: 直接按元数据发布 /parts/arrival;用视觉节点时设 false
