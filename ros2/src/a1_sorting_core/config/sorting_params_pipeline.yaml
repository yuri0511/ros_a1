/task_dispatcher:
  ros__parameters:
    demand_spawn: true          # 按需来料:终态后请求下一件(§5)
    demand_parts: 3             # 单轮总来料数(轮内 part_1..3);launch
                                # 参数 demo_parts 会覆盖此值(默认 0=
                                # 无限持续来料,演示路径)
    demand_color: random         # random=随机四色池(spawn_parts.RANDOM_COLORS);
                                 # 可强制同色压测三格
    spawn_topic: /parts/request_spawn
    camera_xy: [-0.10, -0.48]   # 问题①定罪修复(2026-10-06):v2 柱终档
                                # 同值;此前缺失 ⇒ 判停用默认 0.65,world_x
                                # 恒偏 +0.75,停推进线 0.58 在工件出生帧
                                # 即触发(取证:part 出生 0.18 判 0.93),
                                # 推板 85ms 即回位,物块滞留带缘从未被推
    belt_control: true          # 来料推进+停位+派发门控(语义见上,发推板命令)
    belt_speed_topic: /model/pusher/joint/pusher_slide/cmd_vel
    belt_speed: 0.1             # 推板前进速度 m/s
    belt_stop_x: 0.58           # 工件 world_x 停位线 -> 板回位(停位 x≈0.60;
                                # 给探针 +x 0.04 后前缘留 4cm 挡板余量)。
                                # 2026-10-04 用户拍板拉长带:带面 x 0.35→0.60
                                # (覆盖 0.15..0.75)、挡停板 0.47→0.71、推板
                                # 上限 0.44→0.59,本值随之 0.34→0.58(带与板
                                # 同向平移 +0.24 ⇒ "停位→板内缘"相对几何与旧值
                                # 逐字等价:工件前缘 0.625 对板内缘 0.705 = 8cm,
                                # 与旧 0.385 对 0.465 同)。**注:带尾取件目标
                                # 随停位右移到 (0.60, 0),相关 carry/pick 锚值
                                # 待 Lead 重发新锚表后再接(当前锚表按旧基座帧解,
                                # Lead 已判定作废)。**
    belt_settle_delay: 2.6      # 板回位(1.3s)+停稳+视觉投票余量,后才派发
    # ---- 指定箱派发(2026-10-06 语言指挥模式) ----
    # dispatch_to 命令的合法箱名单 + 箱->执行臂路由表。单臂轮(dual_arm
    # 关)里 arm2 箱在节点启动时自动剔除 -> 语音"放到红箱"会被服务回执
    # 拒绝而非静默失败;双臂轮四箱全合法。抓取段不受影响(锚表路径),
    # 仅放置目标箱被命令覆盖;红线锚值/判据阈值零改动。
    bin_arm_map: ['bin_blue:arm1', 'bin_yellow:arm1',
                  'bin_red:arm2', 'bin_green:arm2']

