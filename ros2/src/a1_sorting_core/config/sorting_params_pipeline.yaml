    #    v3 = v2 的 R4 修订:w3 归一到离 OLD standby 最短行程分支    #    (±2π 同位姿);发布残差最大 37.3um,arm1 最大 PTP 2.81 rad。
    #    64 锚 0 NOSOL;A 档带载 tau 最大 13.26(箱格),两臂逐值对称。
    #    槽位映射(Lead 硬约束):carry_anchor{1..6} 六槽一一对应六格,
    #    arm1 1..3=蓝格/4..6=黄格,arm2 1..3=红格/4..6=绿格;
    #    carry_anchorN_xy = 名义格心(箱心 + bin_grid_offsets,与 JSON
    #    target 的 xy 逐值一致)⇒ _settle_pairs 键互异;六槽全非 NaN。
    #    B 档(carryB 1.22 / relB 1.046)全套见文件末尾注释区,G3 备选。
