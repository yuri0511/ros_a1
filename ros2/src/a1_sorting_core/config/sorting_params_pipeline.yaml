    carry_anchor1_joints: [-1.2748, -1.7008, 1.1843, -1.0543, -1.5708, -4.41639]  # blue1.carryA tau=13.26 tau_c=14.509 fk=13.29us pan=-1.2748 r=0.408
    carry_anchor2_xy: [0.30, 0.28]
    carry_anchor2_joints: [-1.391, -1.8225, 1.277, -1.0253, -1.5708, -4.53259]  # blue2.carryA tau=7.944 tau_c=9.01 fk=15.05us pan=-1.3910 r=0.355
    carry_anchor3_xy: [0.27, 0.33]
    carry_anchor3_joints: [-1.5506, -1.8149, 1.2717, -1.0277, -1.5708, -4.69219]  # blue3.carryA tau=8.279 tau_c=9.357 fk=37.3us pan=-1.5506 r=0.358
    carry_anchor4_xy: [0.87, 0.23]
    carry_anchor4_joints: [0.4662, -1.8085, 1.2673, -1.0296, -1.5708, -2.6754]  # yellow1.carryA tau=8.557 tau_c=9.644 fk=25.93us pan=+0.4662 r=0.361
    carry_anchor5_xy: [0.90, 0.28]
    carry_anchor5_joints: [0.6214, -1.8225, 1.277, -1.0253, -1.5708, -2.5202]  # yellow2.carryA tau=7.944 tau_c=9.01 fk=7.19us pan=+0.6214 r=0.355
    carry_anchor6_xy: [0.87, 0.33]
    carry_anchor6_joints: [0.6388, -1.937, 1.3468, -0.9806, -1.5708, -2.5028]  # yellow3.carryA tau=2.887 tau_c=3.772 fk=17.43us pan=+0.6388 r=0.304
    carry_settle_top1_joints: [-1.2748, -1.7855, 1.5016, -1.2869, -1.5708, -4.41639]  # blue1.setTopA tau=11.481 tau_c=12.729 fk=6.47us pan=-1.2748 r=0.408
    carry_settle_bottom1_joints: [-1.2748, -1.8056, 1.6112, -1.3764, -1.5708, -4.41639]  # blue1.setBotA tau=11.063 tau_c=12.312 fk=20.32us pan=-1.2748 r=0.408
    carry_settle_top2_joints: [-1.391, -1.9125, 1.589, -1.2473, -1.5708, -4.53259]  # blue2.setTopA tau=6.108 tau_c=7.174 fk=11.98us pan=-1.3910 r=0.355
    carry_settle_bottom2_joints: [-1.391, -1.936, 1.6989, -1.3337, -1.5708, -4.53259]  # blue2.setBotA tau=5.638 tau_c=6.703 fk=12.9us pan=-1.3910 r=0.355
    carry_settle_top3_joints: [-1.5506, -1.9044, 1.584, -1.2504, -1.5708, -4.69219]  # blue3.setTopA tau=6.448 tau_c=7.526 fk=18.7us pan=-1.5506 r=0.358
    carry_settle_bottom3_joints: [-1.5506, -1.9276, 1.6938, -1.337, -1.5708, -4.69219]  # blue3.setBotA tau=5.982 tau_c=7.059 fk=26.72us pan=-1.5506 r=0.358
    carry_settle_top4_joints: [0.4662, -1.8977, 1.5798, -1.2528, -1.5708, -2.6754]  # yellow1.setTopA tau=6.73 tau_c=7.817 fk=30.99us pan=+0.4662 r=0.361
    carry_settle_bottom4_joints: [0.4662, -1.9208, 1.6896, -1.3396, -1.5708, -2.6754]  # yellow1.setBotA tau=6.267 tau_c=7.354 fk=21.75us pan=+0.4662 r=0.361
    carry_settle_top5_joints: [0.6214, -1.9125, 1.589, -1.2473, -1.5708, -2.5202]  # yellow2.setTopA tau=6.108 tau_c=7.174 fk=10.92us pan=+0.6214 r=0.355
    carry_settle_bottom5_joints: [0.6214, -1.936, 1.6989, -1.3337, -1.5708, -2.5202]  # yellow2.setBotA tau=5.638 tau_c=6.703 fk=12.84us pan=+0.6214 r=0.355
    carry_settle_top6_joints: [0.6388, -2.036, 1.6566, -1.1914, -1.5708, -2.5028]  # yellow3.setTopA tau=0.956 tau_c=1.841 fk=28.08us pan=+0.6388 r=0.304
    carry_settle_bottom6_joints: [0.63875, -2.06435, 1.76723, -1.27368, -1.5708, -2.50284]  # yellow3.setBotA tau=0.418 tau_c=1.303 fk=2.7us pan=+0.6388 r=0.304
    settle_touch_z: 0.958           # 触底判定:tool0 世界 z ≤ 此值
                                    # (触底几何位 0.954,零下垂下末级
                                    # 必达;+4mm 容 TF/微振;定值不动)
    place_drop_clearance: 0.09  # 松爪高度:指尖(tool0-0.231)须高出箱壁顶
                                # 0.815(0.06 时低 3mm,手指犁壁甩飞工件,联调实证)
    attach_follow: verified_only  # 验证通过后纯物理夹持搬运(§8 联调修订)
    attach_rate_hz: 80.0        # 跟随提频(搬运失真修复 2026-10-09;默认 40=legacy)
    # 预收口(2026-10-08 晚,HANDOFF-20261008 §十六):闭爪前先把两指
    # 内缘间隙收到 0.052+2*gap=62mm(工件 50mm 两侧各余 6mm),把轻触
    # 段单指空扫从 41mm 压到 ~6mm,消掉"单指长距推楔工件→对侧指卡
    # 全开限位钉死"构型。0=禁用(legacy 零行为差)。
    gripper_pre_close_gap: 0.005
    gripper_pre_close_force: -1.5
    gripper_pre_close_wait: 0.5
    gripper_descend_gap: 0.015   # 下探收窄:82mm 入带(带缘余量 27mm)
    pick_center_tol: 0.008   # 实测对中:偏心>8mm 悬停平移重下探(§十六;0=禁用)
    pick_center_max: 0.05    # 偏心>50mm 判失败走重试(带面漂移超窗,不硬追)
    gripper_close_lift_z: 0.012  # 闭爪抬深:指底离带 10mm,消蹭带冻结(§十六)
    vel_scale: 0.2               # 2026-10-05 G2:带尾构型 verify_probe/lift
    acc_scale: 0.2               # 短 LIN 的 elbow 需求 6.10 rad/s² 踩 Pilz
                                 # 5.0 硬限(0.25 时三轮两轮随机耗尽;降 vel
                                 # 拉长时间,加速度需求 ∝1/t² 降至 ~3.9)。
                                 # 0.2 的 >60s 爬行前科属 leg2 边界 LIN,
                                 # 该腿已被 carry_anchor/settle 全锚 PTP
                                 # 替代退役(2026-10-04),风险前提不存在
    # 2026-10-02:acc 0.2 时 leg2 LIN(边界位姿)时间参数化疑似被拉成
    # >60s 爬行轨迹(JTC 受理后 60s 无完成,executor 超时;0.3 时上会话
    # 多轮 ~2s 完成)——维持 0.3 不动
    # carry_safe_z:布局 v2 **两臂统一 1.08**(G0 carryA 域 = z 1.08,τ ≤13.3)。
    # 沿革:旧 1.05(单臂箱 (0.35/0.50,0.20) 时代)与旧 1.22(arm2 高肩 B 档)
    # 均随 v2 作废;carry_safe_z 仅用于 carry_rise(取件点上方 LIN)+
    # 释放闸目标,箱口搬运高度由 6 个 carry_anchor 关节角承载。
    carry_safe_z: 1.08
    # open_loop JTC 下命令完成早于物理到位(错位 ~0.5s),采样窗必须覆盖
    # 探针的物理运动全程:0.5s 不够,1.5s 实证稳定
    verify_sample_span: 1.5
    tcp_z_offset: 0.204         # 2026-10-04 Phase0 定档(原 0.208):减小=指尖
                                # 更低/包覆更深(URDF 实算指尖=feed_z+tcp_z-0.231,
                                # 0.208 时名义指尖高于块底仅 2mm,pick_settle 闸
                                # ±20mm 容差使包覆在 28-48mm 浮动,浅咬即扫帚
                                # 首败);0.204 名义穿带面 2mm,带面接触把深度
                                # 方差截断,包覆钉在 ~50mm。实证 EG1a 两批 32 件:
                                # attempt-1 失败 2/32=6.2%(基线 4/24=16.7%),
                                # 0 新签名,16+16 全 PLACED。合法域 [0.201,0.231]。
                                # **G0 的 pick204 锚即按 tcp=0.204 解**(tool0
                                # 1.009),与本值自洽。legacy 0.211 不动。
    # 箱内 3 格:对角布局(与每臂 6 个 carry anchor 一一对应;y ±0.05:
    # 相邻格方块 |Δy|=5cm 恰好零穿透,消除互碰弹开——±0.045 时角线互穿
    # 2x5mm,物理引擎把后放件推离落点 4.5cm,2026-10-03 实证。G0 复核:
    # 蓝/黄格心 = 箱心+本偏移,与 §2 锚表 FK xy 逐值一致)
    bin_grid_offsets.x: [-0.03, 0.0, -0.03]
    bin_grid_offsets.y: [-0.05, 0.0, 0.05]
    # ---- 路由与料区(arm1 = 北排,不暴露南排)----
    # 四箱一箱一色:blue→bin_blue、yellow→bin_yellow。
    # red/green 也给了映射(便于读),但 **bin_names 只含北排两箱** ⇒
    # 误路由到 arm1 的红/绿件由 _bin_for() 以 unknown_category 立即判
    # FAILED(不动臂、不投错箱)——双臂并联时红/绿由 dispatcher 的
    # arm2_colors 路由给 arm2,arm1 永远不该碰南排。
    # (Lead 派单口径:按 launch 现有 override 逻辑,launch 不覆盖执行器
    #  bin_names ⇒ 由本文件决定,单臂/双臂都只给北排,防南排暴露。)
    bin_for_blue: bin_blue
    bin_for_yellow: bin_yellow
    bin_for_red: bin_red
    bin_for_green: bin_green
    bin_names: [bin_blue, bin_yellow]
    # place_joints_* 必须显式全 NaN(节点内置默认值非 NaN:bin_A/bin_B 是
    # 朝天夹爪时代旧标定、新箱名默认 [0]*6 全零构型,都会架空 carry_anchor 链)
    place_joints_bin_blue: [.nan, .nan, .nan, .nan, .nan, .nan]
    place_joints_bin_yellow: [.nan, .nan, .nan, .nan, .nan, .nan]
    bin_blue.x: 0.30
    bin_blue.y: 0.28
    bin_blue.z: 0.745             # 箱内静置中心(内底 0.72 + 0.025)
    bin_yellow.x: 0.90
    bin_yellow.y: 0.28
    bin_yellow.z: 0.745
# 带尾远距取件:LIN 采样有 KDL 分支翻转 + Pilz 加速度违规双重风险
# (2026-10-05 G2 实证:descend_1/3 elbow 6.10 rad/s² 超 1.5 限,三轮
# 确定性 PLANNING_FAILED),与 arm2 段/本文件锚位注释契约一致用 PTP
