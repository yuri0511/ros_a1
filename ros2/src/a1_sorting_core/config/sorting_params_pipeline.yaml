# 本段重写为 v2 口径(2026-10-04 G1):arm2 从"高肩立柱投 bin_C 的
# 实验臂"改为"与 arm1 同款低肩镜像、朝 +y、管南排 bin_red/bin_green"。
# 锚表 = docs/notes_kinematics_v2.md §2 arm2 表(G0 离线预检,与 arm1 表
# **逐值对称** ⇒ 孪生成立;τ 墙 36.3~44.1 在低肩+箱 r≈0.36 下消解)。
# 旧 E122 高 carry(1.22)+低释(1.046)全套 B 档锚以注释保留在文件末尾,
# 作"G3 楔死备选档"(Lead 派单:默认不启用)。
/pick_place_relay:
  ros__parameters:
    split_plan_execute: true
    controller_action: /arm2_joint_trajectory_controller/follow_joint_trajectory
    arm_name: arm2
