# 锚值状态(2026-10-05 03:3x G1 收口重灌完成):本文件全部关节锚 = 终版
#    权威数据源 **docs/evidence/G0_anchors_v3.json**(5 位发布;v2 的 R4 修订:
#    w3 归一到离 OLD standby 行程最短分支、三处舍入超闸锚热启动提精,发布最大
#    残差 37.3µm ≤ 40µm 闸)。值由脚本逐字落盘零手抄;单测 (g) 项 4 段×75 组
#    逐值核对 ⇒ 锚表再重发即刻抓漂移。
#    两处原 TODO 已由 Lead 定档解除:①arm2 standby = **OLD 保留**(kinematics
#    重验残差 0.0mm;quick 新档被否——standby→带尾笛卡尔腿穿自身 pan 轴投影
#    死区,路由级 NOSOL-SEG);②相机柱终档 **[−0.10, −0.48] + 图像相机 h_fov
#    1.2→1.35**(FOV 轴语义更正:480px 窄轴=世界 x,带缘三点走窄轴;−0.05 被
#    relB→standby 腿 7.9mm 触边弃用)——本文件 camera_xy/recorder camera.x
#    与 SDF 两 pose 已同步 −0.10(vision 侧 yaml 由 vision 队员跟进,Lead 转)。
#    契约注记:pick×pick 互探 +0.1mm ⇒ **双臂不得同时到带尾、单槽串行**
#    (调度器已串行,零行为差;relay 段与 run_acceptance dual 注释已落)。
# A1 分拣任务参数(节点名对应,launch 中统一加载)
# 注意:料区/来料位几何必须与 a1_cell_sim 的世界模型保持一致(README 有说明)。
# ============================================================ 布局 v2(2026-10-04 G1)
# 世界已重建为"双臂四色四箱":arm1 北排(bin_blue 0.30,+0.28 / bin_yellow
# 0.90,+0.28)、arm2 南排(bin_red 0.30,-0.28 / bin_green 0.90,-0.28),
# 两臂同款低肩镜像(基座 (0.60,±0.47) 桌缘外落地,pan 轴 z=0.5645),
# 相机立柱 (-0.10,-0.48) 桌外落地、头高 2.10(终档 2026-10-05)。所有关节
# 锚值取自 G0 定档表
# docs/notes_kinematics_v2.md §1/§2(±2cm 坐标已 Lead 定档,真缺口 0)。
# legacy(单臂 arm1)= 北排 blue/yellow 回归闸(用户预授权方案 a,色池收窄
# blue,yellow);南排红/绿在单臂下够不到,误投会以 unknown_category FAILED。
# 双臂接力:dual_arm:=true 时 launch 追加启动 /pick_place_relay(arm2 执行器)
# 并把 /task_dispatcher 的 relay_mode 置 true;v2 的 arm2 并联分色定值写在
# sorting_params_pipeline.yaml 的 /pick_place_relay 段(本文件的 relay 段是
# 旧 bin_out 经典接力的历史依据,仅 camera_xy/standby 随 v2 同步)。
/task_dispatcher:
  ros__parameters:
    auto_start: true        # 来料即入队开始;改 false 后需调用 /sort_task 服务
    dispatch_delay: 1.0
    relay_mode: false       # true: arm1 完成(PLACED)后派发 arm2 接力
    relay_command_topic: /task/command_arm2
    relay_delay: 1.0        # arm1 完成到派发 arm2 的延迟(秒)
    # ---- L1 方案 a(2026-10-06 拍板):legacy 串推链 + 停位窗派发闸 ----
    # legacy 轮(belt_control=true 且 demand_spawn=false)专属:启动后
    # 一次性串推(advance 定时 belt_chain_advance_s -> 回位 -0.25 ->
    # settle 停板,三命令时序复用 pipeline;此后零推板命令),把三件
    # 匀速推过 2cm 矮挡停板落入板后停放带(x≈0.67-0.95,件间零空档、
    # 已离带)——取件推碰不再有沿带接力行程,L1 漂移(0.94-1.12 NO_IK)
    # 源头消解("贴板轻串"observe 变体实证会把中间件侧弹下带,弃;
    # legacy 轮旁路旧 observe 判停,出生帧 0.58/0.66 在线首帧误触发);
    # 派发前另查队首件 world_x ∈ [belt_dispatch_window_lo,hi](越窗
    # 挂起 2s 复检,超 3 次兜底放行,绝不卡轮)。判据阈值/锚表/gain/
    # tcp_z 零改动;pipeline 轮 prime/窗闸均不激活,demand_spawn 覆盖
    # true 时代码路径短路,dual 零差。
    belt_control: true
    camera_xy: [-0.10, -0.48]     # v2 定档(P1 实证:缺省 0.65 时 world_x
                                  # 恒偏 +0.75,门控会瞎)
    belt_speed_topic: /model/pusher/joint/pusher_slide/cmd_vel
    belt_speed: 0.1               # 串推行进速度(与 pipeline 定档同值)
    belt_stop_x: 0.58             # pipeline 停推进线;legacy 轮 observe
                                  # 旁路不使用,声明同值防误配
    belt_settle_delay: 2.6        # 回位->停板(与 pipeline 定档同值)
    belt_chain_advance_s: 5.0   # 串推定时(取证定案):把三件匀速推过
                                # 2cm 矮挡停板入板后停放带(x≈0.67-0.95,
                                # 准静态无"瓜籽"侧弹;贴板轻串变体实证
                                # 会把中间件弹下带,弃)
    belt_dispatch_window_lo: 0.40 # 停位窗:停放带+出生带恒放行
    belt_dispatch_window_hi: 1.00 # >1.00 = L1 真死区样本(NO_IK 1.00-1.12)
                                  # 越窗挂起;<0.40 = 串推失败留带尾,同拦
    belt_dispatch_recheck_s: 2.0
    belt_dispatch_wait_max: 3     # 越窗 3 次(6s)兜底放行+告警,不卡轮

/pick_place_executor:
  ros__parameters:
    # ---- 运动学 ----
    group_name: ur_manipulator
    planning_frame: world
    tool_frame: tool0
    tcp_z_offset: 0.211     # tool0 到工件夹持中心的竖直距离。指尖在 tool0
    feed_z: 0.805           # legacy 工件生成在带面(见 spawn_parts FEED_Z)
    # 2026-10-03 开启:legacy 取件 xy 用逻辑相机真值。旧 false 用视觉
    # 投影像素估计,带末端槽位 (0.42,0) 投影像素超界(535>480),xy 估计
    # 劣化致偏心抓取 ~8cm,放置跟随偏移(实测 part_3 两轮落 (0.268,0.07))
    pose_from_camera: true
    # 相机安装 xy(布局 v2:立柱在西南角桌外,头高 2.10;2026-10-03 曾在
    # (0.65,-0.32)。**终档 2026-10-05 G1 收口 = (-0.10,-0.48)**(Lead 定档,
    # 依据见 /pick_place_relay 段柱注 + SDF camera_pole 注)。唯一真源仍是
    # 本文件(recorder/relay 与本键同值);vision 侧 camera.x/y/z 由 Lead 转
    # vision 队员同步,代码默认值 0.65/0.0 不动**
    # ——缺此键 executor 用默认 (0.65,0),世界换算会偏 ~0.7m,取件去够空地)
    camera_xy: [-0.10, -0.48]
    # (上接 tcp_z_offset 说明)下方 0.231(夹爪 xacro),取 0.211 使指尖停在
    # 工件底面上方 ~5mm:抓取/放置时手指不穿桌面与料区板(穿桌会被接触
    # 冲量把工件弹飞)。legacy 定值,不动;pipeline/relay 段 0.204 见覆盖文件
    grasp_yaw_deg: 0.0
    pre_grasp_height: 0.08
    lift_height: 0.06
    # 2026-10-03 从 0.98 改 1.05(对齐 pipeline):carry anchor 关节角
    # 对应 tool0 z=1.08,place_release 闸 tol 0.05 下 0.98 目标永不可达
    # (差 0.10),闸 30s 超时致重试耗尽(legacy 回归实证)
    carry_safe_z: 1.05     # 搬运安全巡航高度(tool0 系),legacy 保持 1.05;
                            # pipeline/relay 段 v2 统一 1.08(见覆盖文件)
    descend_steps: 3
    pick_descend_linear: false  # 基表 arm1 补接线(G2 契约同口径):带尾远距
                                # descend 走 LIN 在 t=0.1s IK 采样踩 Pilz
                                # 加速度限(legacy 验收 part_3 三轮耗尽实证),
                                # relay 段与注释契约均为 PTP
    vel_scale: 0.2              # 基表 arm1 补接线(G2/G3 实证档):0.5 默认下
    acc_scale: 0.2              # verify_probe/lift 短 LIN 踩 Pilz 加速度限,
                                # 与 pipeline 两臂同档;非判据红线
    # ---- 待机位(布局 v2 G0 定档,两臂不对称;单臂=arm1 北排口径)----
    # arm1 standby:tool0 (1.035, +0.470, 1.080),泊位朝世界 +x(东端),
    # 与 arm2 standby(朝 -x 西端)方位错开 ⇒ standby×standby 互探
    # +230.6mm,全圈 24 方位最紧 +19.0mm PASS(notes_kinematics_v2 §1)。
    # 旧"停泊让位"约束(arm1 让 +y 侧给 arm2 带尾取件)随 v2 失效——
    # 两臂分居南北后不再需要让位,launch 的并联 standby override 已删。
    standby_x: 1.035
    standby_y: 0.470
    standby_z: 1.080
    # 待机关节角 = G0 定档 arm1 值;与两个 xacro 的 initial_positions
    # (单臂/双臂 arm1)三处必须同值,否则出生位形≠待机位形,首段
    # 就是一次跨构型大转移(自碰撞拒解实证坑)
    standby_joints: [1.2593, -1.6371, 1.1284, -1.0621, -1.5708, -1.8822]
    plan_timeout: 5.0
    # ---- 失败处理 ----
    attempts: 4             # 每件总尝试次数(位姿求解的 IK 分支有随机性,
                            # 重试可覆盖;每次尝试独立重新随机)
    inject_failure_parts: ['']   # 如 ['part_2'] 会对 part_2 注入一次首次失败
    # ---- 夹爪(effort 控制:命令=每指关节推力 N,见 gripper.urdf.xacro
    #      ros2_control effort 接口;闭爪正力压向工件,开爪负力回上限位) ----
    gripper_topic: /gripper_controller/commands
    gripper_status_topic: /gripper/status
    gripper_open: 8.0
    gripper_closed: -8.0
    gripper_joint_count: 2
    gripper_wait: 1.0
    # ---- 类别 -> 料区(四色四箱,一箱一色绝不混色,用户拍板)----
    # arm1 只服务北排蓝/黄(legacy 色池已收窄为 blue,yellow = 方案 a);
    # red/green 指到南排箱,但本段 bin_names 不含南排 ⇒ executor 的
    # _bin_for() 以 unknown_category 判 FAILED(单臂够不到南排,这是
    # 正确行为,不是配置错;双臂并联时由 dispatch 路由给 arm2)
    bin_for_blue: bin_blue
    bin_for_yellow: bin_yellow
    bin_for_red: bin_red
    bin_for_green: bin_green
    # ---- 料区放置位姿(z = 工件静置中心的期望高度)----
    # 只声明本臂(arm1)路由表里会出现的箱:未列入 bin_names 的箱,节点
    # 不会声明 place_joints_<name>,也判不进(见上面 red/green 注释)。
    # 箱心 = 世界模型 sorting_cell.sdf 的 <pose>(±2cm 用户拍板);
    # z = 箱内静置中心 0.745(内底即桌面板 0.72 + 工件半边 0.025)
    bin_names: [bin_blue, bin_yellow]
    bin_blue.x: 0.30
    bin_blue.y: 0.28
    bin_blue.z: 0.745
    bin_yellow.x: 0.90
    bin_yellow.y: 0.28
    bin_yellow.z: 0.745
    # 箱内 3 格对角布局,与下方 6 个 carry anchor 一一对应
    # (bin_blue->锚1-3,bin_yellow->锚4-6)。y ±0.05:相邻格方块 |Δy|=5cm
    # 恰好零穿透,消除互碰弹开(±0.045 时角线互穿 2x5mm,物理引擎把后放件
    # 推离落点 4.5cm,2026-10-03 实证,详见 pipeline yaml 同名注释)
    bin_grid_offsets.x: [-0.03, 0.0, -0.03]
    bin_grid_offsets.y: [-0.05, 0.0, 0.05]
    # place_joints 必须显式全 NaN:节点内置默认值(bin_A/bin_B 旧标定)
    # 非 NaN,且 carry_place_joints 分支优先于 carry_anchor —— 不覆盖
    # 会把下面的锚定全部架空;新箱名默认是 [0.0]*6 全零构型,更危险
    # (64cd236 曾把 bin_C PTP 到全零构型超时)
    place_joints_bin_blue: [.nan, .nan, .nan, .nan, .nan, .nan]
    place_joints_bin_yellow: [.nan, .nan, .nan, .nan, .nan, .nan]
    # ---- 放置锚定 A 档(终版数据源 = docs/evidence/G0_anchors_v3.json,
    #      Lead 2026-10-05 03:3x G1 收口重灌;值由脚本从 JSON 落盘,零手抄)。
    #    闸(一字未放宽):fk<=40um、带载 tau_lift<30N·m、净距惩罚后>=8mm
    #    belt_stop(沿 v2 定案口径)= [0.6, 0.0];v3 meta.pole_final = -0.1(相机柱终档,G1 已按此接 SDF/yaml)。
    #    v3 = v2 的 R4 修订:w3 归一到离 OLD standby 最短行程分支    #    (±2π 同位姿);发布残差最大 37.3um,arm1 最大 PTP 2.81 rad。
    #    64 锚 0 NOSOL;A 档带载 tau 最大 13.26(箱格),两臂逐值对称。
    #    槽位映射(Lead 硬约束):carry_anchor{1..6} 六槽一一对应六格,
    #    arm1 1..3=蓝格/4..6=黄格,arm2 1..3=红格/4..6=绿格;
    #    carry_anchorN_xy = 名义格心(箱心 + bin_grid_offsets,与 JSON
    #    target 的 xy 逐值一致)⇒ _settle_pairs 键互异;六槽全非 NaN。
    #    B 档(carryB 1.22 / relB 1.046)全套见文件末尾注释区,G3 备选。
    carry_anchor1_xy: [0.27, 0.23]
    carry_anchor1_joints: [-1.2748, -1.7008, 1.1843, -1.0543, -1.5708, -4.41639]  # blue1.carryA tau=13.26 tau_c=14.509 fk=13.29us pan=-1.2748 r=0.408
    carry_anchor2_xy: [0.30, 0.28]
    carry_anchor2_joints: [-1.391, -1.8225, 1.277, -1.0253, -1.5708, -4.53259]  # blue2.carryA tau=7.944 tau_c=9.01 fk=15.05us pan=-1.3910 r=0.355
    carry_anchor3_xy: [0.27, 0.33]
    carry_anchor3_joints: [-1.5506, -1.8149, 1.2717, -1.0277, -1.5708, -4.69219]  # blue3.carryA tau=8.279 tau_c=9.357 fk=37.3us pan=-1.5506 r=0.358
    carry_anchor4_xy: [0.87, 0.23]
    carry_anchor4_joints: [0.4662, -1.8085, 1.2673, -1.0296, -1.5708, -2.6754]  # yellow1.carryA tau=8.557 tau_c=9.644 fk=25.93us pan=+0.4662 r=0.361
    carry_anchor5_xy: [0.90, 0.28]
    carry_anchor5_joints: [0.6214, -1.8225, 1.277, -1.0253, -1.5708, -2.5202]  # yellow2.carryA tau=7.944 tau_c=9.01 fk=7.19us pan=+0.6214 r=0.355
    carry_anchor6_xy: [0.87, 0.33]
    carry_anchor6_joints: [0.6388, -1.937, 1.3468, -0.9806, -1.5708, -2.5028]  # yellow3.carryA tau=2.887 tau_c=3.772 fk=17.43us pan=+0.6388 r=0.304
    carry_settle_top1_joints: [-1.2748, -1.7855, 1.5016, -1.2869, -1.5708, -4.41639]  # blue1.setTopA tau=11.481 tau_c=12.729 fk=6.47us pan=-1.2748 r=0.408
    carry_settle_bottom1_joints: [-1.2748, -1.8056, 1.6112, -1.3764, -1.5708, -4.41639]  # blue1.setBotA tau=11.063 tau_c=12.312 fk=20.32us pan=-1.2748 r=0.408
    carry_settle_top2_joints: [-1.391, -1.9125, 1.589, -1.2473, -1.5708, -4.53259]  # blue2.setTopA tau=6.108 tau_c=7.174 fk=11.98us pan=-1.3910 r=0.355
    carry_settle_bottom2_joints: [-1.391, -1.936, 1.6989, -1.3337, -1.5708, -4.53259]  # blue2.setBotA tau=5.638 tau_c=6.703 fk=12.9us pan=-1.3910 r=0.355
    carry_settle_top3_joints: [-1.5506, -1.9044, 1.584, -1.2504, -1.5708, -4.69219]  # blue3.setTopA tau=6.448 tau_c=7.526 fk=18.7us pan=-1.5506 r=0.358
    carry_settle_bottom3_joints: [-1.5506, -1.9276, 1.6938, -1.337, -1.5708, -4.69219]  # blue3.setBotA tau=5.982 tau_c=7.059 fk=26.72us pan=-1.5506 r=0.358
    carry_settle_top4_joints: [0.4662, -1.8977, 1.5798, -1.2528, -1.5708, -2.6754]  # yellow1.setTopA tau=6.73 tau_c=7.817 fk=30.99us pan=+0.4662 r=0.361
    carry_settle_bottom4_joints: [0.4662, -1.9208, 1.6896, -1.3396, -1.5708, -2.6754]  # yellow1.setBotA tau=6.267 tau_c=7.354 fk=21.75us pan=+0.4662 r=0.361
    carry_settle_top5_joints: [0.6214, -1.9125, 1.589, -1.2473, -1.5708, -2.5202]  # yellow2.setTopA tau=6.108 tau_c=7.174 fk=10.92us pan=+0.6214 r=0.355
    carry_settle_bottom5_joints: [0.6214, -1.936, 1.6989, -1.3337, -1.5708, -2.5202]  # yellow2.setBotA tau=5.638 tau_c=6.703 fk=12.84us pan=+0.6214 r=0.355
    carry_settle_top6_joints: [0.6388, -2.036, 1.6566, -1.1914, -1.5708, -2.5028]  # yellow3.setTopA tau=0.956 tau_c=1.841 fk=28.08us pan=+0.6388 r=0.304
    carry_settle_bottom6_joints: [0.63875, -2.06435, 1.76723, -1.27368, -1.5708, -2.50284]  # yellow3.setBotA tau=0.418 tau_c=1.303 fk=2.7us pan=+0.6388 r=0.304
    settle_touch_z: 0.958       # 触底判定:tool0 世界 z ≤ 此值(触底几何位
                                # 0.954,+4mm 容 TF/微振;legacy tcp_z 0.211
                                # 下名义触底 0.956,仍在容差内)
    # 组长补充(2026-10-03):启用 set-down 梯子的开关(executor 分支
    # 要求 >0);0.09 与 pipeline 同配 —— 不开则回落"下探到放置面+
    # 快开"旧路径,会被指面摩擦弹飞(联调实证)
    place_drop_clearance: 0.09
    # ---- 仿真附着(运动学跟随:工件随夹爪链接 TF 刚性移动,见 attach_helper) ----
