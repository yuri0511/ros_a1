# A1 双臂工作站运动学求解配置:两个规划组各一条(参数与单臂版一致,
# timeout 0.3 / search_resolution 0.01,理由见 kinematics.yaml 注释)。
ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.01
  kinematics_solver_timeout: 0.3
arm2_ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.01
  kinematics_solver_timeout: 0.3
