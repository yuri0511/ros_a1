# A1 工作站运动学求解配置。
# 覆盖官方 ur_moveit_config/config/kinematics.yaml 的两点:
# - timeout 0.005 -> 0.05: KDL 数值 IK 从当前关节种子迭代,大角度转移
#   (如 +y 侧取料到 -y 侧放置)时短超时下随机重启不足,报 NO_IK_SOLUTION;
# - search_resolution 加粗,减少冗余关节采样步数。
ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.01
  kinematics_solver_timeout: 0.3
